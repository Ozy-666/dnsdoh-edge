# Settings for cookie-rotate.sh, the DNS cookie secret rotation (unbound/README.md describes each key).
secret_file=/var/lib/unbound/cookie-secrets.txt
# Root-only dir (systemd StateDirectory=, 0700): never the dnsdoh-compile-owned /var/lib/dnsdoh.art.
state_file=/var/lib/dnsdoh.art-cookies/cookie-rotate.state
file_owner=unbound:unbound
unbound_control=/usr/sbin/unbound-control
period_days=30
drop_after_s=7200
hook_timeout_s=30
# Optional program run after each rotation with the action as $1 (add|drop). Empty disables it.
post_rotate_hook=
